[workspace]
members = [".", "tools/mock-energibridge"]

[package]
name = "pegada-term"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Shows the energy used by every command you run in the terminal, using EnergiBridge as the sensor."
license = "MIT"
repository = "https://github.com/GreenSeal-dev/pegada-term"
homepage = "https://github.com/GreenSeal-dev/pegada-term"
readme = "README.md"
keywords = ["energy", "terminal", "shell", "green-software", "power"]
categories = ["command-line-utilities"]
include = ["src/**", "hooks/**", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
